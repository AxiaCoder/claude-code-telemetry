apiVersion: 1

providers:
  # Les dashboards viennent des fichiers du depot, jamais de la base Grafana.
  # allowUiUpdates: false => une modification faite dans l'UI ne peut pas etre
  # enregistree par-dessus le fichier. On edite dans l'UI, on exporte le JSON,
  # on le commite ici.
  - name: home-server
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

  # Les dashboards des services externes, montes par docker-compose.override.yml :
  # un sous-dossier par service, un dossier Grafana par sous-dossier.
  - name: services-externes
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/externe
      foldersFromFilesStructure: true
