# Branche un service externe : ses dashboards et ses alertes restent dans son depot.
#
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# puis remplacer /srv/mon-service par le chemin du depot du service sur ce serveur.
# Le dernier segment de la cible (mon-service) devient le nom du dossier dans Grafana.
# Un service de plus : une ligne de plus sous grafana, une sous vmalert.

services:
  grafana:
    volumes:
      - /srv/mon-service/observabilite/dashboards:/var/lib/grafana/externe/mon-service:ro
  vmalert:
    volumes:
      - /srv/mon-service/observabilite/alertes:/etc/vmalert/externe/mon-service:ro
